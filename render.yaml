services:
  - type: web
    name: chez-yasmine-api
    runtime: docker
    plan: free
    dockerfilePath: ./docker/Dockerfile.nestjs
    dockerContext: .
    envVars:
      # Valeurs réelles à renseigner manuellement dans le tableau de bord
      # Render (Environment) après création du service — jamais dans ce
      # fichier, qui est committé dans Git.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: NODE_ENV
        value: production
