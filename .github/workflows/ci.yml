name: CI

on:
  pull_request:
    branches: [main, master, develop]
  push:
    branches: [main, master]

jobs:
  api:
    name: NestJS API — lint, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api/nestjs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/api/nestjs/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  web:
    name: Flutter Web — analyze, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web/flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web
