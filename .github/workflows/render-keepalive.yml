name: Render Keep-Alive

# Le plan gratuit Render met le service en veille après ~15 minutes sans
# trafic ; la requête suivante subit alors un "cold start" de 30 à 60s avant
# de répondre — c'est ce qui rend l'application difficile à afficher pour un
# utilisateur qui arrive après une pause (constaté par l'utilisateur,
# 2026-09-14). Un ping, bien en-deçà du seuil de mise en veille, maintient le
# service éveillé.
#
# 2026-10-04 : GitHub n'exécute PAS les tâches planifiées à l'heure — mesuré
# sur 99 intervalles consécutifs de ce workflow (cron toutes les 10 min) :
# médiane 14,7 min, 48 intervalles de plus de 15 min, maximum 5 h 43. L'API se
# rendormait donc environ une fois sur deux. Fréquence doublée pour réduire
# ces trous ; la planification de GitHub reste « au mieux » et aucune
# fréquence ne la rend fiable (un service externe de supervision, ou un plan
# Render payant, le serait).
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    name: Ping l'API NestJS déployée
    runs-on: ubuntu-latest
    steps:
      - name: Interroger la racine de l'API (aucune authentification requise)
        run: |
          code=$(curl -s -o /dev/null --retry 3 --retry-delay 5 --max-time 90 -w '%{http_code}' https://chez-yasmine-api.onrender.com/)
          echo "Réponse API : HTTP $code"
          if [ "$code" -ge 500 ]; then
            echo "::error::L'API a répondu avec une erreur serveur ($code)."
            exit 1
          fi
